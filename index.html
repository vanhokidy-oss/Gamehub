<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameHub</title>
  <style>
    body { 
      font-family: Arial; 
      background: #0f172a; 
      color: white; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      margin: 0; 
      padding: 20px;
    }
    .box { 
      background: #1e293b; 
      padding: 30px; 
      border-radius: 12px; 
      width: 90%; 
      max-width: 500px; 
      box-shadow: 0 0 20px rgba(0,0,0,0.5); 
    }
    h2 { 
      text-align: center; 
      margin-bottom: 20px; 
      color: #38bdf8; 
    }
    h3 {
      color: #f59e0b;
      margin-top: 25px;
      border-bottom: 1px solid #334155;
      padding-bottom: 8px;
    }
    input, textarea { 
      width: 100%; 
      padding: 12px; 
      margin: 8px 0; 
      border: none; 
      border-radius: 8px; 
      background: #334155; 
      color: white; 
      box-sizing: border-box; 
    }
    button { 
      width: 100%; 
      padding: 12px; 
      margin: 8px 0; 
      border: none; 
      border-radius: 8px; 
      background: #38bdf8; 
      color: #0f172a; 
      font-weight: bold; 
      cursor: pointer; 
    }
    button:hover { background: #0ea5e9; }
    .admin-btn { background: #f59e0b !important; }
    .admin-btn:hover { background: #d97706 !important; }
    .danger-btn { background: #ef4444 !important; color: white !important; }
    .success-btn { background: #22c55e !important; color: white !important; }
    .link { 
      text-align: center; 
      margin-top: 15px; 
      color: #94a3b8; 
      cursor: pointer; 
    }
    #error { 
      color: #f87171; 
      text-align: center; 
      margin: 10px 0; 
      font-size: 14px; 
    }
