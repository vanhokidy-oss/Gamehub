<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameHub Login</title>
  <style>
    body { 
      font-family: Arial; 
      background: #0f172a; 
      color: white; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      height: 100vh; 
      margin: 0; 
    }
    .box { 
      background: #1e293b; 
      padding: 30px; 
      border-radius: 12px; 
      width: 90%; 
      max-width: 400px; 
      box-shadow: 0 0 20px rgba(0,0,0,0.5); 
    }
    h2 { 
      text-align: center; 
      margin-bottom: 20px; 
      color: #38bdf8; 
    }
    input { 
      width: 100%; 
      padding: 12px; 
      margin: 8px 0; 
      border: none; 
      border-radius: 8px; 
      background: #334155; 
      color: white; 
      box-sizing: border-box; 
    }
    button { 
      width: 100%; 
      padding: 12px; 
      margin: 8px 0; 
      border: none; 
      border-radius: 8px; 
      background: #38bdf8; 
      color: #0f172a; 
      font-weight: bold; 
      cursor: pointer; 
    }
    button:hover { background: #0ea5e9; }
    .link { 
      text-align: center; 
      margin-top: 15px; 
      color: #94a3b8; 
      cursor: pointer; 
    }
    #error { 
      color: #f87171; 
      text-align: center; 
      margin: 10px 0; 
      font-size: 14px; 
    }
    #userInfo { text-align: center; }
  </style>
</head>
<body>

  <div class="box" id="authBox">
    <h2 id="formTitle">Ingia GameHub</h2>
    <div id="error"></div>
    <input type="email" id="email" placeholder="Email yako">
    <input type="password" id="password" placeholder="Password">
    <button id="authBtn">Ingia</button>
    <div class="link" id="toggleForm">Huna account? Jisajili</div>
  </div>

  <div class="box" id="userBox" style="display:none;">
    <h2>Karibu GameHub!</h2>
    <div id="userInfo"></div>
    <button id="logoutBtn">Toka</button>
    <p style="text-align:center;margin-top:20px;color:#94a3b8;">Games zinakuja hapa...</p>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

    const firebaseConfig = {
      apiKey: "AIzaSyDCcKsD13XuF8pK-Dv-VRWJSdf-a6CqYPk",
      authDomain: "gamehub-login-381ca.firebaseapp.com",
      projectId: "gamehub-login-381ca",
      storageBucket: "gamehub-login-381ca.firebasestorage.app",
      messagingSenderId: "645807432349",
      appId: "1:645807432349:web:75e5613e0cf4fd61b32a74"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const authBox = document.getElementById('authBox');
    const userBox = document.getElementById('userBox');
    const email = document.getElementById('email');
    const password = document.getElementById('password');
    const authBtn = document.getElementById('authBtn');
    const toggleForm = document.getElementById('toggleForm');
    const formTitle = document.getElementById('formTitle');
    const errorDiv = document.getElementById('error');
    const userInfo = document.getElementById('userInfo');
    const logoutBtn = document.getElementById('logoutBtn');

    let isLogin = true;

    toggleForm.onclick = () => {
      isLogin = !isLogin;
      formTitle.textContent = isLogin ? 'Ingia GameHub' : 'Jisajili GameHub';
      authBtn.textContent = isLogin ? 'Ingia' : 'Jisajili';
      toggleForm.textContent = isLogin ? 'Huna account? Jisajili' : 'Una account? Ingia';
      errorDiv.textContent = '';
    };

    authBtn.onclick = async () => {
      errorDiv.textContent = '';
      try {
        if (isLogin) {
          await signInWithEmailAndPassword(auth, email.value, password.value);
        } else {
          await createUserWithEmailAndPassword(auth, email.value, password.value);
        }
      } catch (error) {
        errorDiv.textContent = error.message.replace('Firebase: ', '');
      }
    };

    logoutBtn.onclick = () => signOut(auth);

    onAuthStateChanged(auth, (user) => {
      if (user) {
        authBox.style.display = 'none';
        userBox.style.display = 'block';
        userInfo.innerHTML = `Umeingia kama: <br><b>${user.email}</b>`;
      } else {
        authBox.style.display = 'block';
        userBox.style.display = 'none';
        email.value = '';
        password.value = '';
      }
    });
  </script>
</body>
</html>
