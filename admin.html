<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameHub Admin</title>
    <style>
        body { font-family: Arial; background: #0a0a0a; color: white; padding: 20px; max-width: 600px; margin: auto; }
        .login, .panel { background: #1a1a1a; padding: 20px; border-radius: 12px; border: 1px solid #00e5ff; }
        input { width: 100%; padding: 12px; margin: 8px 0; background: #0a0a0a; border: 1px solid #333; color: white; border-radius: 8px; box-sizing: border-box; }
        button { background: #00e5ff; color: #000; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px; }
        .hidden { display: none; }
        #output { background: #000; padding: 15px; border-radius: 8px; margin-top: 15px; white-space: pre-wrap; word-wrap: break-word; }
        label { color: #00e5ff; font-weight: bold; display: block; margin-top: 10px; }
    </style>
</head>
<body>
    <div id="loginDiv" class="login">
        <h2>🔐 GameHub Admin Login</h2>
        <input type="password" id="password" placeholder="Ingiza Password">
        <button onclick="checkPassword()">Ingia</button>
        <p id="error" style="color: red;"></p>
    </div>

    <div id="panelDiv" class="panel hidden">
        <h2>👑 GameHub Admin Panel</h2>
        <label>Jina la Game:</label>
        <input type="text" id="gameName" placeholder="Mfano: GTA San Andreas">
        
        <label>Aina ya Game:</label>
        <input type="text" id="gameType" placeholder="Mfano: Action - Open World">
        
        <label>Ukubwa MB:</label>
        <input type="number" id="gameSize" placeholder="Mfano: 2500">
        
        <label>Link ya APK:</label>
        <input type="text" id="gameLink" placeholder="Weka link ya Google Drive/Telegram">
        
        <button onclick="generateCode()">Tengeneza Code</button>
        
        <h3>Code ya Ku-copy:</h3>
        <div id="output">Jaza fomu hapo juu...</div>
        <button onclick="copyCode()" style="background: #4CAF50;">Copy Code</button>
        
        <h3>Maelekezo:</h3>
        <ol>
            <li>Copy code hapo juu</li>
            <li>Fungua `index.html` kwenye GitHub</li>
            <li>Tafuta `<!-- GAMES ZINAISHIA HAPA -->`</li>
            <li>Paste code kabla ya hio line</li>
            <li>Commit changes</li>
        </ol>
    </div>

<script>
const CORRECT_PASSWORD = "vanho2007";

function checkPassword() {
    const pass = document.getElementById('password').value;
    if(pass === CORRECT_PASSWORD) {
        document.getElementById('loginDiv').classList.add('hidden');
        document.getElementById('panelDiv').classList.remove('hidden');
    } else {
        document.getElementById('error').innerText = "Password si sahihi!";
    }
}

function generateCode() {
    const name = document.getElementById('gameName').value;
    const type = document.getElementById('gameType').value;
    const size = document.getElementById('gameSize').value;
    const link = document.getElementById('gameLink').value;
    
    if(!name || !type || !size || !link) {
        alert("Jaza sehemu zote mkuu!");
        return;
    }
    
    const code = `<div class="game-card">
    <h3>${name}</h3>
    <p>${type} - ${size}MB</p>
    <a href="${link}" class="btn">Download APK</a>
</div>`;
    
    document.getElementById('output').innerText = code;
}

function copyCode() {
    const text = document.getElementById('output').innerText;
    navigator.clipboard.writeText(text);
    alert("Code ime-copy! Nenda paste kwenye index.html");
}
</script>
</body>
</html>
